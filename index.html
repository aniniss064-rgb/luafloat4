<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Lua" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f0f0f" />
<title>Lua Executor</title>
<style>
header,.label{display:none}
main{padding:8px;gap:8px}
:root{--bg:#0f0f0f;--panel:#1a1a1a;--border:#2a2a2a;--text:#e0e0e0;--muted:#888;--accent:#00c853;--accent-hover:#00e676;--error:#ff5252;--code-bg:#121212;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--panel);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px}
header h1{font-size:1.15rem;font-weight:600;color:var(--accent);white-space:nowrap}
.header-right{display:flex;align-items:center;gap:10px}
.status{font-size:.75rem;color:var(--muted)}
.status.ready{color:var(--accent)}.status.error{color:var(--error)}
#installBtn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:7px 12px;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap;display:none}
#installBtn:active{background:var(--accent-hover)}
main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px;gap:10px}
.label{font-size:.8rem;color:var(--muted);margin-bottom:4px}
#code{flex:1;width:100%;background:var(--code-bg);color:#d4d4d4;border:1px solid var(--border);border-radius:12px;padding:14px;font-family:"SF Mono","Fira Code",Consolas,monospace;font-size:14px;line-height:1.45;resize:none;outline:none}
#code:focus{border-color:#444}
.buttons{display:flex;gap:8px;flex-shrink:0}
button.action{flex:1;padding:13px 8px;border:none;border-radius:12px;font-size:.95rem;font-weight:600;cursor:pointer;transition:transform .1s}
button.action:active{transform:scale(.97)}
#run{background:var(--accent);color:#000}
#clear,#example{background:#2a2a2a;color:var(--text)}
.output-section{flex:1;display:flex;flex-direction:column;min-height:0}
#output{flex:1;background:var(--code-bg);border:1px solid var(--border);border-radius:12px;padding:14px;font-family:"SF Mono","Fira Code",Consolas,monospace;font-size:13px;line-height:1.45;overflow-y:auto;white-space:pre-wrap;word-break:break-word;color:#ce9178}
#output .error{color:var(--error)}#output .info{color:var(--muted)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:1000;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--panel);border-radius:16px 16px 0 0;width:100%;max-width:420px;padding:20px;border:1px solid var(--border)}
.modal h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.modal p{font-size:.9rem;line-height:1.5;margin-bottom:10px}
.modal ol{padding-left:20px;margin-bottom:16px;font-size:.9rem;line-height:1.6}
.modal li{margin-bottom:6px}
.modal-close{width:100%;padding:12px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;font-weight:600;font-size:.95rem;cursor:pointer}
footer{text-align:center;padding:8px 12px 12px;font-size:.7rem;color:var(--muted);flex-shrink:0}
</style>
</head>
<body>
<header>
  <h1>Lua Executor</h1>
  <div class="header-right">
    <div class="status" id="status">Chargement...</div>
  </div>
</header>
<main>
  <div style="display:flex;flex-direction:column;flex:1.5;min-height:0;">
    <div class="label">Code Lua</div>
    <textarea id="code" spellcheck="false" placeholder="Écris ton code Lua ici..."></textarea>
  </div>
  <div class="buttons">
    <button class="action" id="run">▶ Exécuter</button>
    <button class="action" id="clear">Effacer</button>
    <button class="action" id="example">Exemple</button>
  </div>
  <div class="output-section">
    <div class="label">Sortie</div>
    <div id="output"><span class="info">La sortie apparaîtra ici...</span></div>
  </div>
</main>

<div class="modal-overlay" id="installModal">
  <div class="modal">
    <h2>Installer Lua Executor</h2>
    <div id="installInstructions"></div>
    <button class="modal-close" id="closeModal">Compris</button>
  </div>
</div>

<script src="fengari-web.js"></script>
<script>
const $=id=>document.getElementById(id);
const codeEl=$("code"),outputEl=$("output"),statusEl=$("status");
const exampleCode=`-- Exemple simple
print("Bonjour depuis ton téléphone !")

local function factorielle(n)
  if n <= 1 then return 1 end
  return n * factorielle(n - 1)
end

print("5! =", factorielle(5))

for i = 1, 5 do
  print("Compteur :", i)
end
`;
let luaReady=false;

function setStatus(t,type=""){statusEl.textContent=t;statusEl.className="status "+type}
function setOutput(text,isError=false){
  outputEl.innerHTML="";
  const s=document.createElement("span");
  if(isError)s.className="error";else if(!text)s.className="info";
  s.textContent=text||"(aucune sortie)";
  outputEl.appendChild(s);outputEl.scrollTop=0;
}
function init(){
  if(luaReady)return;
  if(typeof fengari==="undefined"){setStatus("Erreur","error");setOutput("Impossible de charger le moteur Lua.\nVérifie ta connexion puis recharge la page.",true);return}
  luaReady=true;setStatus("Prêt","ready");
  try{codeEl.value=localStorage.getItem("lua_code")||exampleCode}catch(e){codeEl.value=exampleCode}
  codeEl.addEventListener("input",()=>{try{localStorage.setItem("lua_code",codeEl.value)}catch(e){}});
}
function runLua(){
  if(!luaReady){setOutput("Le moteur Lua n'est pas encore prêt.",true);return}
  const code=codeEl.value;
  if(!code.trim()){setOutput("Le code est vide.",true);return}
  try{
    const{lua,lauxlib,lualib,to_luastring}=fengari;
    const L=lauxlib.luaL_newstate();
    lualib.luaL_openlibs(L);
    lua.lua_newtable(L);
    lua.lua_setglobal(L,to_luastring("__print_buffer"));
    const override=`function print(...)
      local n=select("#",...)
      local t={}
      for i=1,n do t[i]=tostring(select(i,...)) end
      __print_buffer[#__print_buffer+1]=table.concat(t,"\\t")
    end`;
    let st=lauxlib.luaL_dostring(L,to_luastring(override));
    if(st!==lua.LUA_OK){setOutput("Erreur interne: "+lua.lua_tojsstring(L,-1),true);lua.lua_close(L);return}
    st=lauxlib.luaL_dostring(L,to_luastring(code));
    const lines=[];
    lua.lua_getglobal(L,to_luastring("__print_buffer"));
    const len=lua.lua_rawlen(L,-1);
    for(let i=1;i<=len;i++){lua.lua_rawgeti(L,-1,i);lines.push(lua.lua_tojsstring(L,-1));lua.lua_pop(L,1)}
    lua.lua_pop(L,1);
    if(st!==lua.LUA_OK){
      const err=lua.lua_tojsstring(L,-1);
      setOutput((lines.length?lines.join("\n")+"\n":"")+err,true);
    }else setOutput(lines.join("\n"));
    lua.lua_close(L);
  }catch(e){setOutput("Erreur: "+e.message,true)}
}
$("run").addEventListener("click",runLua);
$("clear").addEventListener("click",()=>{codeEl.value="";setOutput("Code effacé.")});
$("example").addEventListener("click",()=>{codeEl.value=exampleCode});
codeEl.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runLua()}});
window.addEventListener("load",init);
setTimeout(init,2000);
</script>
</body>
</html>
